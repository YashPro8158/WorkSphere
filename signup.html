<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSphere | Signup</title>
    <link rel="stylesheet" href="CSS/signup.css">
    <link rel="stylesheet" href="CSS/component.css">
</head>
<style>
    body{
        font-family: sans-serif;
    }
</style>

<body>
    <h1>Create Your Worksphere Account </h1>
    <div id="popmsg"></div>
    <div class="signupcontainer">
        <form action="index.html" onclick="event.preventDefault()" id="signupform">
            <label for="regname">Username:</label>
            <input type="text" id="regusername">
            <label for="regemail">Email-Id:</label>
            <input type="email" id="regemail">
            <label for="reg2fachildhoodname">What was your child hood name (for security reason):</label>
            <input type="text" id="reg2fachildhoodname">
            <label for="regpassword">Password:</label>
            <input type="password" id="regpassword">
            <div class="buttons">
                <button type="submit" id="regformsubmitbtn">Register</button>
                <button type="button" id="loginbtn">Login</button>
            </div>
        </form>
    </div>

    <script src="JS/signup.js"></script>
</body>

</html>
