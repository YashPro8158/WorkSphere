<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSphere - Productivity & Project Management Platform</title>
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/task.css">
    <link rel="stylesheet" href="CSS/component.css">
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-chubby/css/uicons-regular-chubby.css'>
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/4.0.0/uicons-thin-straight/css/uicons-thin-straight.css'>
</head>

<body id="darktheme">

    <div id="popmsg"></div>
    <div class="topmenus">
        <div class="leftlogo" id="logo">
            WorkSphere
        </div>
        <div class="rightmenus">
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="notes.html">Notes</a></li>
                <li><a href="task.html">Task</a></li>
                <li><a href="expenses.html">Expenses</a></li>
                <li id="changetheme"></li>
            </ul>

        </div>
        <div class="useraccount" id="useraccount">
            <div class="profileicon" id="profileicon"><span id="username"></span> <i class="fi fi-rc-circle-user"></i></div>
            <ul class="menus" id="menus">
            </ul>
        </div>
    </div>
    <div id="popmsg"></div>
    <!-- Create Container -->
    <div class="createcontainer">
        <h2>Create Task</h2>
        <div class="input">
            <label for="tasktitle">Title: </label>
            <input type="text" id="tasktitle" required>
            <label for="taskdesc">Description: </label>
            <textarea name="notedesc" id="taskdesc" required rows="8"></textarea>
            <label for="taskduedate">Due Date: </label>
            <input type="date" id="taskduedate" required>
            <label for="taskpriority">Task Priority: </label>
            <select name="taskpriority" id="taskpriority">
                <option value="high&uarr;">High &uarr;</option>
                <option value="medium&#9633;">Medium &#9633;</option>
                <option value="low&darr;">Low &darr;</option>
            </select>
            <button id="addtaskbtn">Add Task</button>
        </div>
    </div>


    <!-- Search  Container -->
    <div class="searchcontainer">
        <h2>Search Task</h2>
        <div class="input">
            <input type="search" id="searchtask" placeholder="Type here to search.... ">
        </div>
    </div>


    <!-- Filter Container -->
    <div class="filtercontainer">
        <h2>Filter Task</h2>
        <div class="filterbuttons">
            <button id="alltaskbtn">All Task</button>
            <button id="pendingtaskbtn">Pending</button>
            <button id="comletedtaskbtn">Completed</button>
        </div>
    </div>


    <!-- My Note Container -->
    <div class="mylistcontainer">
        <h2>My Task</h2>
        <div id="alltask" class="alltask">
        </div>
        <div class="updatecontainer" id="updatecontainer">
            <h2>Update Task: </h2>
            <label for="updatetitle">Title: </label>
            <input type="text" id="updatetitle">

            <label for="updatedesc">description: </label>
            <textarea name="updatedesc" id="updatedesc" rows="8"></textarea>

            <label for="updateduedate">description: </label>
            <input type="date" id="updateduedate" required>
            <label for="updatepriority">Task Priority: </label>
            <select name="updatepriority" id="updatepriority">
                <option value="high&uarr;">High &uarr;</option>
                <option value="medium&#9633;">Medium &#9633;</option>
                <option value="low&darr;">Low &darr;</option>
            </select>

            <div class="bottomupdatebtns">
                <button id="updateusertask">Update</button>
                <button id="canceltaskupdate">Cancel</button>
            </div>
        </div>
    </div>

    <script src="JS/main.js"></script>
    <script src="JS/task.js"></script>
</body>

</html>
